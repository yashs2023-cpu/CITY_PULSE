<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CityPulse — Submit a Report</title>
<style>:focus-visible{outline:3px solid #FBBF24;outline-offset:3px}*{box-sizing:border-box}body{font-family:-apple-system,"Segoe UI",sans-serif;background:#0A0E1A;color:#E4E9F2;max-width:640px;margin:0 auto;padding:24px}h1{font-size:20px}label{display:block;font-size:13px;color:#BDC8DC;font-weight:650;margin-top:14px}input,select,textarea{box-sizing:border-box;width:100%;min-height:44px;padding:10px;margin-top:6px;background:#1A2333;border:1px solid #232D42;color:#E4E9F2;border-radius:8px;font:inherit}button{min-height:44px;margin-top:18px;padding:11px 18px;border:0;border-radius:8px;background:linear-gradient(135deg,#22D3EE,#A78BFA);font-weight:700;cursor:pointer}.note{font-size:12px;color:#6B7A99;margin-top:14px;line-height:1.5}#msg{margin-top:14px;font-size:14px;line-height:1.5}#msg:empty{display:none}.status-error{color:#FCA5A5}.status-ok{color:#86EFAC}@media(max-width:480px){body{padding:16px}button{width:100%}}.hp{position:absolute;left:-9999px}</style></head><body>
<h1>Submit a city report</h1><p class="note">Reports are anonymous and are <b>not public</b> until an authority reviews and approves them. Do not include names, phone numbers or number plates.</p>
<label for="type">Type</label><select id="type"><option value="incident">Incident (accident, heavy traffic, flooding…)</option><option value="planned_work">Planned work (permit required)</option><option value="advisory">Advisory</option></select>
<label for="category">Category</label><select id="category"></select>
<label for="title">Title (required)</label><input id="title" maxlength="120" required><label for="description">Description (required)</label><textarea id="description" rows="4" maxlength="1000" required></textarea>
<label for="road">Road</label><input id="road" maxlength="120"><label for="area">Area</label><input id="area" maxlength="80">
<label for="lat">Latitude (optional)</label><input id="lat" type="number" min="-90" max="90" step="any"><label for="lon">Longitude (optional)</label><input id="lon" type="number" min="-180" max="180" step="any">
<div id="pw" style="display:none"><label for="permitRef">Permit / file reference</label><input id="permitRef"><label for="activeFrom">Work starts</label><input id="activeFrom" type="datetime-local"><label for="activeUntil">Work ends</label><input id="activeUntil" type="datetime-local"><label for="alternative">Suggested alternative route</label><input id="alternative" maxlength="200"></div>
<label class="hp" for="website">Leave this field empty</label><input class="hp" id="website" tabindex="-1" autocomplete="off"><button id="go" type="submit">Submit report</button><div id="msg" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
const CATS={incident:['accident','heavy_traffic','flooding','road_damage','streetlight','water','other'],planned_work:['road_construction','utility_work','maintenance','event'],advisory:['general']};
const $=id=>document.getElementById(id);
function fill(){ $('category').innerHTML=CATS[$('type').value].map(c=>`<option>${c}</option>`).join(''); $('pw').style.display=$('type').value==='planned_work'?'block':'none'; }
$('type').onchange=fill; fill();
$('go').onclick=async()=>{ const b={}; ['type','category','title','description','road','area','lat','lon','permitRef','alternative','website'].forEach(k=>b[k]=$(k).value);
  ['activeFrom','activeUntil'].forEach(k=>{ if($(k).value) b[k]=new Date($(k).value).toISOString(); });
  if(b.lat===''&&b.lon===''){delete b.lat;delete b.lon;} else if(b.lat===''||b.lon===''){ $('msg').className='status-error'; $('msg').textContent='Enter both latitude and longitude, or leave both empty.'; return; } else { b.lat=Number(b.lat);b.lon=Number(b.lon);if(b.lat < -90||b.lat > 90||b.lon < -180||b.lon > 180){$('msg').className='status-error';$('msg').textContent='Latitude must be between -90 and 90 and longitude between -180 and 180.';return;} }
  if(b.activeFrom&&b.activeUntil&&new Date(b.activeUntil)<=new Date(b.activeFrom)){ $('msg').className='status-error';$('msg').textContent='Work end time must be later than the start time.';return; }
  const button=$('go');button.disabled=true;button.textContent='Submitting…';$('msg').textContent='';
  try { const r=await fetch('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); const j=await r.json().catch(()=>({error:'Invalid server response'})); if(!r.ok) throw new Error((j.errors||[j.error||'Submission failed']).join('; ')); $('msg').className='status-ok';$('msg').textContent=`${j.message||'Report submitted for review.'} Reference: ${j.id||'not provided'}`; } catch(e) { $('msg').className='status-error';$('msg').textContent=`Could not submit report. ${e.message||'Check your connection and try again.'}`; } finally {button.disabled=false;button.textContent='Submit report';} };
</script></body></html>
