<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CityPulse — Authority Console</title>
<style>:focus-visible{outline:3px solid #FBBF24;outline-offset:3px}*{box-sizing:border-box}body{font-family:-apple-system,"Segoe UI",sans-serif;background:#0A0E1A;color:#E4E9F2;margin:0;padding:24px}h1{font-size:20px}input,select,textarea,button{min-height:44px;padding:9px;background:#1A2333;border:1px solid #232D42;color:#E4E9F2;border-radius:8px;font:inherit}button{cursor:pointer;background:linear-gradient(135deg,#22D3EE,#A78BFA);color:#08101C;font-weight:700;border:0}.card{background:#121826;border:1px solid #232D42;border-radius:12px;padding:14px;margin:12px 0}.m{font-size:12px;color:#6B7A99}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;padding:2px 8px;border-radius:20px;background:#1A2333}#err{color:#FCA5A5;font-size:14px;margin-top:8px}#status{font-size:14px;margin-top:12px;min-height:1.4em}@media(max-width:480px){body{padding:14px}.row button{flex:1}.card{padding:12px}}</style></head><body>
<h1>Authority Console <span class="m">(simulated authority role)</span></h1>
<div id="login"><label for="u">Username</label><input id="u" autocomplete="username" placeholder="Username"> <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" placeholder="Password"> <button id="in" type="button">Log in</button><div id="err" role="alert" aria-live="assertive"></div></div>
<div id="app" style="display:none"><div id="status" role="status" aria-live="polite"></div><div class="row"><label for="f">Filter reports</label><select id="f"><option value="">All</option><option>submitted</option><option>under_review</option><option>approved</option><option>rejected</option><option>changes_requested</option><option>resolved</option><option>cancelled</option></select><button id="rl">Reload</button><button id="au">Audit log</button></div><div id="list"></div><pre id="audit" class="m"></pre></div>
<script>
let T=''; const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){ const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:body?JSON.stringify(body):undefined}); const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j; }
$('in').onclick=async()=>{ try{ const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})}); const j=await r.json(); if(!r.ok) throw new Error(j.error); T=j.token; $('login').style.display='none'; $('app').style.display='block'; load(); }catch(e){ $('err').textContent=e.message; } };
async function load(){ $('status').textContent='Loading reports…'; try { const j=await api('/api/admin/reports'+($('f').value?'?state='+encodeURIComponent($('f').value):'')); $('list').innerHTML=j.reports.map(r=>`<div class="card"><b>${esc(r.title)}</b> <span class="tag">${esc(r.type)} · ${esc(r.category)}</span> <span class="tag">${esc(r.state)}</span>
<div class="m">${esc(r.road)} ${esc(r.area)} · ${r.lat!=null?r.lat+','+r.lon:'no coords'} · id ${r.id} · ${esc(r.createdAt)}</div><p>${esc(r.description)}</p>
${r.type==='planned_work'?`<div class="m">Permit ref: <b>${esc(r.permitRef)}</b> · ${esc(r.activeFrom)} → ${esc(r.activeUntil)} · alt: ${esc(r.alternative)}</div>`:''}
<div class="row"><input id="n-${r.id}" placeholder="note"> ${r.type==='planned_work'?`<label class="m"><input type="checkbox" id="pv-${r.id}"> I checked the permit</label>`:''}
<button onclick="d('${r.id}','approve')">Approve</button><button onclick="d('${r.id}','reject')">Reject</button><button onclick="d('${r.id}','request_changes')">Request changes</button><button onclick="c('${r.id}','resolve')">Resolve</button><button onclick="c('${r.id}','cancel')">Cancel</button></div></div>`).join('')||'<p class="m">No reports.</p>'; $('status').textContent=`Loaded ${j.reports.length} report(s).`; } catch(e) { $('status').textContent=`Could not load reports: ${e.message}`; } }
async function d(id,decision){ try{ await api(`/api/admin/reports/${id}/decision`,{decision,note:$('n-'+id).value,permitVerified:!!($('pv-'+id)&&$('pv-'+id).checked)}); $('status').textContent=`Report ${id}: ${decision.replaceAll('_',' ')}.`; load(); }catch(e){ $('status').textContent=`Action failed: ${e.message}`; } }
async function c(id,action){ try{ await api(`/api/admin/reports/${id}/close`,{action,note:$('n-'+id).value}); $('status').textContent=`Report ${id}: ${action}d.`; load(); }catch(e){ $('status').textContent=`Action failed: ${e.message}`; } }
$('rl').onclick=load; $('f').onchange=load; $('au').onclick=async()=>{ try { const j=await api('/api/admin/audit'); $('audit').textContent=j.audit.map(a=>`${a.at}  ${a.actor}  ${a.action}  ${a.reportId||''}`).join('\n')||'No audit entries.'; } catch(e) { $('status').textContent=`Could not load audit log: ${e.message}`; } };
</script></body></html>
